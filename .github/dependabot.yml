version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, php]
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /docker
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on Node.js LTS releases. Odd-numbered majors are never LTS, so
      # move to the next LTS major by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on the MySQL LTS line (9.7.x) and accept patch releases only.
      # Newer version numbers (for example 26.x) are short-lived Innovation
      # releases. Move to the next LTS by hand.
      - dependency-name: mysql
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
