name: ZAP baseline

# OWASP ZAP baseline scan: ZAP crawls the public (signed-out) pages of the
# production image and checks the responses passively. It does not attack the
# app. Rules are tuned in .zap/rules.tsv; only rules set to FAIL there fail
# this job (-I), every other finding is listed in the job log and the
# "zap-baseline-report" artifact.
#
# Opt-in, because it builds the production image and starts a full stack
# for every run. It runs:
#   - on demand: Actions tab > ZAP baseline > Run workflow (any branch);
#   - on a pull request to main that has the "run-zap" label (adding the
#     label starts it; later pushes to the pull request run it again);
#   - every Monday and on every pull request to main when the repository
#     variable RUN_ZAP is "true" (Settings > Secrets and variables > Actions >
#     Variables).
# Otherwise the job is skipped, which GitHub reports as a success. See
# docs/ci-cd.md.
#
# There is no path filter: a workflow-level filter would also stop the
# "run-zap" label from working on pull requests outside those paths.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC, only when RUN_ZAP is "true"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# Runs started by adding some other label do nothing, so they get their own
# group and never cancel a real run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

env:
  E2E_PROJECT: lvcs-zap
  E2E_IMAGE: lvcs-e2e:ci

jobs:
  baseline:
    name: ZAP baseline scan
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && vars.RUN_ZAP == 'true')
      || (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'run-zap')
        || (github.event.action != 'labeled' && (vars.RUN_ZAP == 'true'
          || contains(github.event.pull_request.labels.*.name, 'run-zap')))
      ))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          load: true
          tags: ${{ env.E2E_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same stack as the E2E tests; the app is published on 127.0.0.1:8080.
      - name: Start the stack
        run: tests/e2e/setup/start-stack.sh
        env:
          E2E_SKIP_BUILD: "1"

      # The action runs ZAP with --network=host, so it reaches the published port.
      # The ZAP image tag is "stable" on purpose, so the weekly scan uses current rules.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Stop the stack
        if: always()
        run: tests/e2e/setup/stop-stack.sh
