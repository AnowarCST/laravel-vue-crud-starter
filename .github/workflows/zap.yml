name: ZAP baseline

# OWASP ZAP baseline scan: ZAP crawls the public (signed-out) pages of the
# production image and checks the responses passively. It does not attack the
# app. Rules are tuned in .zap/rules.tsv; only rules set to FAIL there fail
# this job (-I), every other finding is listed in the job log and the
# "zap-baseline-report" artifact.
#
# Runs weekly, on demand, and on pull requests to main that change code or
# configuration that shapes HTTP responses (headers, cookies, CSP, Apache).
# The path filter keeps the 5-10 minute scan off unrelated pull requests.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "routes/**"
      - "resources/views/**"
      - "public/**"
      - "docker/**"
      - "composer.lock"
      - ".zap/**"
      - "tests/e2e/compose.yaml"
      - "tests/e2e/setup/**"
      - ".github/workflows/zap.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_PROJECT: lvcs-zap
  E2E_IMAGE: lvcs-e2e:ci

jobs:
  baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          load: true
          tags: ${{ env.E2E_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same stack as the E2E tests; the app is published on 127.0.0.1:8080.
      - name: Start the stack
        run: tests/e2e/setup/start-stack.sh
        env:
          E2E_SKIP_BUILD: "1"

      # The action runs ZAP with --network=host, so it reaches the published port.
      # The ZAP image tag is "stable" on purpose, so the weekly scan uses current rules.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Stop the stack
        if: always()
        run: tests/e2e/setup/stop-stack.sh
