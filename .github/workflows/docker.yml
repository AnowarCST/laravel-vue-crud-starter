name: Docker

# Builds the production image (docker/Dockerfile, target "prod") and checks
# that /up responds. Opt-in, because the E2E and ZAP workflows build the
# same image, so this job is only useful when they do not run. It runs:
#   - on demand: Actions tab > Docker > Run workflow (any branch);
#   - on a pull request that has the "run-docker-build" label (adding the
#     label starts it; later pushes to the pull request run it again);
#   - on every pull request and push to main when the repository variable
#     RUN_DOCKER_BUILD is "true" (Settings > Secrets and variables > Actions >
#     Variables).
# Otherwise the job is skipped, which GitHub reports as a success. See
# docs/ci-cd.md.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Runs started by adding some other label do nothing, so they get their own
# group and never cancel a real run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker (prod image)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && vars.RUN_DOCKER_BUILD == 'true')
      || (github.event_name == 'pull_request' && (
        (github.event.action == 'labeled' && github.event.label.name == 'run-docker-build')
        || (github.event.action != 'labeled' && (vars.RUN_DOCKER_BUILD == 'true'
          || contains(github.event.pull_request.labels.*.name, 'run-docker-build')))
      ))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build prod target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: false
          load: true
          tags: laravel-vue-crud-starter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /up
        run: |
          docker run -d --name app -p 127.0.0.1:8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci.sqlite \
            -e SESSION_DRIVER=file -e CACHE_STORE=file \
            laravel-vue-crud-starter:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/up; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
