; Hardened PHP defaults shared by the dev and prod images.
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
register_argc_argv=Off
allow_url_include=Off
allow_url_fopen=On
date.timezone=UTC

; Uploads: images only are accepted by the app (validated server-side);
; keep the transport limits small.
file_uploads=On
upload_max_filesize=5M
max_file_uploads=10
post_max_size=6M
memory_limit=256M
max_execution_time=30
max_input_time=30
max_input_vars=2000

; Laravel manages its own sessions/cookies; these only affect native PHP sessions.
session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_httponly=1
session.cookie_samesite=Lax
; The app does not use PHP's native upload progress tracking. Turning it off
; removes an attack surface named in the PHP2Shell advisory (October 2026).
session.upload_progress.enabled=0
