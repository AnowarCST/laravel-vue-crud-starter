# Server-wide Apache hardening (replaces Debian's conf-available/security.conf).
# Security headers for application responses (CSP with nonces, X-Frame-Options,
# Referrer-Policy, Permissions-Policy, COOP, HSTS) are set by the Laravel
# middleware so they stay in one place; do not add a CSP here.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size

# Requests larger than this are rejected before reaching PHP
# (php post_max_size is 6M, see docker/php/local.ini).
LimitRequestBody 8388608

# Never serve VCS metadata or dotfiles from any directory.
<DirectoryMatch "/\.(git|svn|hg)">
    Require all denied
</DirectoryMatch>
