# Laravel application vhost. Only public/ is served; everything else under the
# project root is denied. Apache listens on 8080 as the unprivileged www-data
# user (see docker/Dockerfile).
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        # FollowSymLinks is required for the public/storage -> storage/app/public
        # link created by `php artisan storage:link`.
        Options -Indexes -MultiViews -ExecCGI -Includes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # User uploads (Laravel "public" disk: storage/app/public, served through
    # the public/storage symlink). Apache matches <Directory> against the
    # requested path, so both the link path and the real path are covered.
    # Nothing in here may execute, list, or be content-sniffed.
    <DirectoryMatch "^/var/www/html/(public/storage|storage/app/public)(/|$)">
        Options -Indexes -MultiViews -ExecCGI -Includes +FollowSymLinks
        AllowOverride None
        php_admin_flag engine off
        RewriteEngine Off
        RemoveHandler .php .phtml .phar .cgi .pl .py .sh
        <FilesMatch "(?i)\.(php[0-9]?|pht|phtml|phar|cgi|pl|py|sh|shtml|html?|svgz?|xht(ml)?|js|mjs)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    <LocationMatch "(?i)^/(?:vendor|node_modules)(?:/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)\.(env|log|sql|sqlite|bak|swp|key|pem|lock|ya?ml|md|dist)$">
        Require all denied
    </FilesMatch>

    # nosniff for every response (static files included). The Laravel
    # middleware also sends it for dynamic responses; drop that copy so the
    # header is emitted exactly once.
    Header onsuccess unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
