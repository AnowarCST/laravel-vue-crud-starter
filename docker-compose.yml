services:
  app:
    image: ghcr.io/thecodingmachine/php:8.3-v4-apache
    platform: linux/amd64
    container_name: laravel_app
    working_dir: /var/www/html
    environment:
      APACHE_DOCUMENT_ROOT: public
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz || echo ok"]
      interval: 30s
      timeout: 5s
      retries: 3

  node:
    image: node:lts
    container_name: laravel_node
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    # Use CI if lockfile exists; otherwise fallback to install
    command: sh -lc "npm ci || npm install && npm run watch-poll"
    depends_on:
      - app

  db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: laravel_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

volumes:
  db_data:
