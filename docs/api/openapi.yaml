openapi: 3.1.0
info:
  title: Laravel Vue CRUD Starter API
  version: 2.0.0
  summary: JSON API used by the dashboard and by API clients.
  description: |
    The JSON API under `/api`. The dashboard (the Vue single-page application)
    uses it, and so can any other client that has a token.

    ## Authentication

    Every endpoint except `GET /api/version` needs an authenticated account
    with a **verified email address**. The Passport `api` guard accepts two
    kinds of credentials:

    - **Bearer token** (`bearerToken`): a Passport personal access token or an
      OAuth2 access token, sent as `Authorization: Bearer <token>`. Create a
      personal access token on the dashboard's **Developer** page (the server
      needs a personal access client, created with
      `php artisan passport:client --personal`). Personal access tokens expire
      after 6 months. Changing the account password revokes all of the
      account's tokens.
    - **SPA cookie** (`spaCookie` + `csrfToken`): after a browser signs in,
      every `GET` page load sets the encrypted, HttpOnly `laravel_token`
      cookie. Requests that send this cookie must also send the session's CSRF
      token in the `X-CSRF-TOKEN` header (or the `XSRF-TOKEN` cookie value in
      `X-XSRF-TOKEN`). If the CSRF token is missing or wrong, the request is
      treated as unauthenticated (`401`). A cookie issued before the
      account's password last changed is rejected the same way. This is how
      the dashboard and the "Try it out" button on `/docs` call the API.

    If both are present, the bearer token is used.

    ## Requests and responses

    - Send `Accept: application/json`. Request bodies are JSON unless noted.
    - Successful responses (except `GET /api/version`) use the envelope
      `{"success": true, "data": ..., "message": "..."}`.
    - List endpoints return a Laravel length-aware paginator in `data`
      (10 items per page, newest first, `?page=` selects the page).
      `GET /api/product` also accepts search, filter, sort and `per_page`
      parameters, and rejects invalid values with `422`.
    - Errors have a `message` field. Validation errors (`422`) also have an
      `errors` object that maps each field to a list of messages.
    - An account whose email address is not verified receives `403` with the
      message `Your email address is not verified.` on every authenticated
      endpoint.
    - When `APP_DEBUG=false`, `404` and `500` bodies are generic
      (`Not Found.` and `Server Error`).

    ## Rate limiting

    Every `/api` route uses the `api` rate limiter: 60 requests per minute per
    account, or per IP address for unauthenticated requests. Responses carry
    `X-RateLimit-Limit` and `X-RateLimit-Remaining`. Over the limit, the API
    returns `429` with a `Retry-After` header.

    ## Roles

    Accounts have a `type` of `admin` or `user`. Any verified account can read,
    create and update products, categories and tags. Only administrators can
    delete them, and only administrators can manage accounts (`/api/user`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: This application (the API lives under /api on the same host)
tags:
  - name: Meta
    description: Application information. No authentication.
  - name: Profile
    description: The signed-in account. These endpoints only ever change the caller's own account.
  - name: Products
    description: Products, their tags and product images. Deleting requires an administrator.
  - name: Categories
    description: Product categories. Deleting requires an administrator.
  - name: Tags
    description: Product tags. Deleting requires an administrator.
  - name: Users
    description: Account management. Administrators only.
security:
  - bearerToken: []
  - spaCookie: []
    csrfToken: []
paths:
  /version:
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Get the application version
      description: Returns `config('app.version')` (the `APP_VERSION` environment variable). This endpoint does not use the response envelope.
      security: []
      responses:
        '200':
          description: The application version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    examples: ['2.0.0']
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Get the signed-in account
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Profile]
      operationId: updateProfile
      summary: Update the signed-in account's name and email address
      description: |
        Only `name` and `email` are accepted; any other field (such as `type`
        or `password`) is ignored. If the email address changes, the account
        becomes unverified and a verification email is sent to the new
        address. Until the new address is verified, authenticated endpoints
        return `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  maxLength: 191
                email:
                  type: string
                  format: email
                  maxLength: 191
                  description: Must not belong to another account.
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /change-password:
    post:
      tags: [Profile]
      operationId: changePassword
      summary: Change the signed-in account's password
      description: |
        On success, every OAuth access token and refresh token of the account
        is revoked, including the bearer token used for this request. Browser
        sessions that signed in with the old password are signed out the next
        time they load a page (Laravel's `AuthenticateSession` middleware),
        and `laravel_token` cookies issued before the change are rejected
        with `401`. The browser session that sent this request with the
        `laravel_token` cookie stays signed in under a new session id, and
        the response sets a new `laravel_token` cookie for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, confirm_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
                  description: At least 12 characters, at most 72 characters and 72 bytes, and different from `current_password`.
                confirm_password:
                  type: string
                  format: password
                  description: Must match `new_password`.
      responses:
        '200':
          description: The password was changed. `data` is an empty array.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 0
              example:
                success: true
                data: []
                message: Password Has been updated
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /product:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: |
        Products with their category and tags. Soft-deleted products are not
        included. Without parameters the list is sorted newest first, 10 per
        page.

        Every parameter is optional, and filters are combined (a product must
        match all of them). An empty value (for example `?search=`) is the
        same as leaving the parameter out. Any other invalid value, such as an
        unknown `sort` or `per_page=51`, is rejected with `422`; it is never
        ignored. The page links in the response (`first_page_url`,
        `next_page_url`, `links` and so on) keep the query parameters.
      parameters:
        - name: search
          in: query
          required: false
          description: |
            Case-insensitive text that must appear in the product's name, SKU
            or description. `%` and `_` are matched literally.
          schema:
            type: string
            maxLength: 100
          example: mug
        - name: category_id
          in: query
          required: false
          description: Only products in this category. An id that does not exist returns an empty list.
          schema:
            type: integer
            minimum: 1
        - name: tag
          in: query
          required: false
          description: Only products that have the tag with this id.
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          description: Only products with this status.
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: stock
          in: query
          required: false
          description: |
            Only products at this stock level: `in` is 1 unit or more, `low` is
            1 to 5 units, and `out` is 0 units.
          schema:
            type: string
            enum: [in, low, out]
        - name: sort
          in: query
          required: false
          description: |
            Sort order. `newest` and `oldest` sort by creation time; `name`,
            `price` and `stock` sort in ascending order, and a leading `-`
            sorts in descending order. Products with equal values are ordered
            by id in the same direction.
          schema:
            type: string
            enum: [newest, oldest, name, '-name', price, '-price', stock, '-stock']
            default: newest
        - name: per_page
          in: query
          required: false
          description: Products per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          description: A query parameter has an invalid value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The selected sort is invalid. (and 1 more error)
                errors:
                  sort:
                    - The selected sort is invalid.
                  per_page:
                    - The per page field must not be greater than 50.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      description: |
        `sku` is required and must be unique. It is trimmed and stored in upper
        case (`ab-12` is saved as `AB-12`). `stock` defaults to `0` and
        `status` to `active`. Upload the image first with
        `POST /api/product/upload` and send the returned `path` as `photo`.
        Tags are matched by name and created if they do not exist yet.

        The response contains the saved fields only: it does not include the
        `category` and `tags` relations, and it has no `photo` field when no
        photo was sent. Fetch the product to get the full record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
      responses:
        '200':
          description: The created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /product/upload:
    post:
      tags: [Products]
      operationId: uploadProductImage
      summary: Upload a product image
      description: |
        Accepts a JPEG, PNG or WebP image of at most 5 MB and 4096x4096 pixels.
        The server decodes the image and stores a re-encoded copy (same format)
        under a random name, so metadata such as EXIF and GPS data, and
        anything hidden in or appended to the file, is removed. Files that
        cannot be decoded as an image are rejected with `422`. Use the returned
        `path` as the `photo` of a product.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The image file (`jpg`, `jpeg`, `png` or `webp`).
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: The stored image.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [path, url]
                        properties:
                          path:
                            type: string
                            pattern: '^uploads/[A-Za-z0-9]{40}\.(jpg|png|webp)$'
                            description: Path on the `public` disk. Send it as `photo` when creating or updating a product.
                          url:
                            type: string
                            description: Browser URL of the stored image (under `/storage/uploads/`).
              example:
                success: true
                data:
                  path: uploads/3hX0aZbQe1c9TfLwVq2Kj7Rr5Ns8Pm4Ud6Yo0Gi1.png
                  url: http://localhost:8000/storage/uploads/3hX0aZbQe1c9TfLwVq2Kj7Rr5Ns8Pm4Ud6Yo0Gi1.png
                message: Image uploaded
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /product/stats:
    get:
      tags: [Products]
      operationId: getProductStats
      summary: Get product counts
      description: |
        Product counts for the dashboard. Soft-deleted products are not
        counted. `low_stock` counts products with 1 to 5 units, and
        `out_of_stock` counts products with 0 units, whatever their status.
      responses:
        '200':
          description: Product counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductStats'
              example:
                success: true
                data:
                  total: 14
                  active: 12
                  draft: 1
                  archived: 1
                  low_stock: 3
                  out_of_stock: 1
                message: Product statistics
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /product/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product
      description: The product with its category and tags.
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Update a product
      description: |
        `PATCH` is accepted as well and behaves the same way. `category_id`,
        `name`, `description` and `price` are required. `sku`, `stock`,
        `status`, `tags` and `photo` are optional: a field that is left out
        does not change. If `sku` is sent, it must be a valid, unique SKU (it
        cannot be removed); products created before SKUs existed have none
        until one is set. If `tags` is sent, the product's tags are replaced
        by that list. `photo` must be a path returned by
        `POST /api/product/upload`, or the product's current `photo` value.
        When the photo is replaced, the old uploaded file is deleted if no
        other product uses it. The response does not include the `category`
        and `tags` relations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product (administrators only)
      description: Soft-deletes the product. The response contains the product with `deleted_at` set.
      responses:
        '200':
          description: The deleted product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /category:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of categories, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: The created category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /category/list:
    get:
      tags: [Categories]
      operationId: listCategoryNames
      summary: List all category names
      description: Every category as an object that maps the category id to its name, for select inputs. Not paginated.
      responses:
        '200':
          description: Category names keyed by id.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties:
                          type: string
              example:
                success: true
                data:
                  '1': Electronics
                  '2': Books
                message: Category list
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /category/{category}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get a category
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Update a category
      description: '`PATCH` is accepted as well and behaves the same way. `name` is required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category (administrators only)
      description: Products that use the category are not changed.
      responses:
        '200':
          description: The deleted category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /tag:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of tags, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TagPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '200':
          description: The created tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /tag/list:
    get:
      tags: [Tags]
      operationId: listTagNames
      summary: List all tag names
      description: Every tag's `name` and `id`, for tag inputs. Not paginated.
      responses:
        '200':
          description: All tags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [name, id]
                          properties:
                            name:
                              type: string
                            id:
                              type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /tag/{tag}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [Tags]
      operationId: getTag
      summary: Get a tag
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Tags]
      operationId: updateTag
      summary: Update a tag
      description: '`PATCH` is accepted as well and behaves the same way.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '200':
          description: The updated tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Delete a tag (administrators only)
      responses:
        '200':
          description: The deleted tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List accounts (administrators only)
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of accounts, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account (administrators only)
      description: The new account's email address is marked as verified, because an administrator chose it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, email, password]
              properties:
                type:
                  $ref: '#/components/schemas/UserType'
                name:
                  type: string
                  maxLength: 191
                email:
                  type: string
                  format: email
                  maxLength: 191
                  description: Must not belong to another account.
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
                  description: At least 12 characters, at most 72 characters and 72 bytes.
      responses:
        '200':
          description: The created account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get an account (administrators only)
      description: Non-administrators always receive `403`, whether or not the account exists.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update an account (administrators only)
      description: |
        `PATCH` is accepted as well and behaves the same way. Every field is
        optional; fields that are left out do not change. An empty or `null`
        `password` keeps the current password. Administrators cannot change
        the `type` of their own account (`422`). Changing the password revokes
        all of that account's OAuth tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/UserType'
                name:
                  type: string
                  maxLength: 191
                email:
                  type: string
                  format: email
                  maxLength: 191
                  description: Must not belong to another account.
                password:
                  type: [string, 'null']
                  format: password
                  minLength: 12
                  maxLength: 72
                  description: At least 12 characters, at most 72 characters and 72 bytes.
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete an account (administrators only)
      description: |
        Permanently deletes the account and revokes its OAuth tokens.
        Administrators cannot delete their own account (`403`). Note that
        `data` is an array that contains the deleted account.
      responses:
        '200':
          description: The deleted account, wrapped in an array.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Passport personal access token (create one on the dashboard's
        Developer page) or an OAuth2 access token issued by this server's
        `/oauth/token` endpoint.
    spaCookie:
      type: apiKey
      in: cookie
      name: laravel_token
      description: |
        Encrypted, HttpOnly cookie that Passport's `CreateFreshApiToken`
        middleware sets on `GET` page loads for a signed-in browser session.
        Only valid together with `csrfToken`, and only until the account's
        password changes.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: |
        The session CSRF token (the `csrf-token` meta tag on the application's
        pages). Required with `spaCookie`; `X-XSRF-TOKEN` with the value of the
        `XSRF-TOKEN` cookie also works.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    ProductId:
      name: product
      in: path
      required: true
      description: Product id.
      schema:
        type: integer
        minimum: 1
    CategoryId:
      name: category
      in: path
      required: true
      description: Category id.
      schema:
        type: integer
        minimum: 1
    TagId:
      name: tag
      in: path
      required: true
      description: Tag id.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: user
      in: path
      required: true
      description: Account id.
      schema:
        type: integer
        minimum: 1

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    RateLimitLimit:
      description: Requests allowed per minute.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current minute.
      schema:
        type: integer

  responses:
    Unauthenticated:
      description: No valid bearer token, or the SPA cookie was sent without a matching CSRF token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    EmailNotVerified:
      description: The account has not verified its email address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Your email address is not verified.
    Forbidden:
      description: The account may not perform this action, or its email address is not verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAllowed:
              summary: Not allowed (for example, not an administrator)
              value:
                message: This action is unauthorized.
            emailNotVerified:
              summary: Email address not verified
              value:
                message: Your email address is not verified.
    NotFound:
      description: No record with this id exists. With `APP_DEBUG=true` the message names the model instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Not Found.
    ValidationFailed:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The name field is required. (and 1 more error)
            errors:
              name:
                - The name field is required.
              email:
                - The email field is required.
    TooManyRequests:
      description: The rate limit (60 requests per minute) was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          description: The first error message, plus the number of other errors.
        errors:
          type: object
          description: Error messages for each invalid field.
          additionalProperties:
            type: array
            items:
              type: string
    SuccessEnvelope:
      type: object
      required: [success, data, message]
      properties:
        success:
          const: true
        data:
          description: The result. Its type depends on the endpoint.
        message:
          type: string
          description: A short, human-readable description of the result.

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 timestamp in UTC, with microseconds.
      examples: ['2026-01-31T09:30:00.000000Z']

    PaginatorMeta:
      type: object
      description: Laravel length-aware paginator fields. `data` holds the items of the page.
      required: [current_page, first_page_url, from, last_page, last_page_url, links, next_page_url, path, per_page, prev_page_url, to, total]
      properties:
        current_page:
          type: integer
        first_page_url:
          type: string
        from:
          type: [integer, 'null']
          description: Position of the first item on this page, or null for an empty page.
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          description: Links for a pagination control, including "Previous" and "Next".
          items:
            type: object
            required: [url, label, active]
            properties:
              url:
                type: [string, 'null']
              label:
                type: string
                description: Page number, or an HTML-escaped "Previous" / "Next" label.
              page:
                type: [integer, 'null']
              active:
                type: boolean
        next_page_url:
          type: [string, 'null']
        path:
          type: string
        per_page:
          type: integer
          examples: [10]
        prev_page_url:
          type: [string, 'null']
        to:
          type: [integer, 'null']
        total:
          type: integer

    UserType:
      type: string
      enum: [admin, user]
    User:
      type: object
      required: [id, name, email, type, email_verified_at, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        type:
          $ref: '#/components/schemas/UserType'
        email_verified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PaginatorMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    Category:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 191
        description:
          type: [string, 'null']
          maxLength: 1000
    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Category'
    CategoryPage:
      allOf:
        - $ref: '#/components/schemas/PaginatorMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'

    Tag:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TagInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 191
    TagResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Tag'
    TagPage:
      allOf:
        - $ref: '#/components/schemas/PaginatorMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tag'

    ProductTag:
      type: object
      description: A tag as it appears on a product. The tag name is in `text`.
      required: [text, id]
      properties:
        text:
          type: string
          description: The tag name.
        id:
          type: integer
        pivot:
          type: object
          properties:
            product_id:
              type: integer
            tag_id:
              type: integer
    ProductStatus:
      type: string
      enum: [active, draft, archived]
    ProductStats:
      type: object
      required: [total, active, draft, archived, low_stock, out_of_stock]
      properties:
        total:
          type: integer
          minimum: 0
          description: All products that are not deleted.
        active:
          type: integer
          minimum: 0
        draft:
          type: integer
          minimum: 0
        archived:
          type: integer
          minimum: 0
        low_stock:
          type: integer
          minimum: 0
          description: Products with 1 to 5 units in stock.
        out_of_stock:
          type: integer
          minimum: 0
          description: Products with 0 units in stock.
    Product:
      type: object
      description: |
        `photo` and `deleted_at` are always present when reading products. The
        create response contains only the saved fields, so it has no
        `deleted_at`, and no `photo` unless one was sent.
      required: [id, name, sku, description, price, stock, status, category_id, photo_url, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: [string, 'null']
          pattern: '^[A-Z0-9-]+$'
          maxLength: 64
          description: Unique stock-keeping unit in upper case. Null only for products created before SKUs existed.
          examples: ['HK-3001']
        description:
          type: [string, 'null']
        price:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: The price as a string with exactly two decimal places (the column is `decimal(10,2)`), in every response, whether it was sent as a number or a string.
          examples: ['34.00', '12.50']
        stock:
          type: integer
          minimum: 0
          description: Units in stock. 1 to 5 units counts as low stock.
        status:
          $ref: '#/components/schemas/ProductStatus'
        category_id:
          type: integer
        photo:
          type: [string, 'null']
          description: Path of the image, either an upload on the `public` disk (for example `uploads/<random>.png`) or a bundled demo image (for example `images/products/ceramic-coffee-mug.webp`).
        photo_url:
          type: [string, 'null']
          description: Full URL of the image (under `/storage/uploads/` for uploads, under `/images/` for demo images), or null when the product has no photo.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        deleted_at:
          description: Set when the product has been deleted (soft delete).
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        category:
          description: Included when reading products (list and get). Null if the category no longer exists.
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        tags:
          type: array
          description: Included when reading products (list and get).
          items:
            $ref: '#/components/schemas/ProductTag'
    ProductInput:
      type: object
      description: Fields for updating a product. See `ProductCreateInput` for creating one.
      required: [category_id, name, description, price]
      properties:
        category_id:
          type: integer
          description: Id of an existing category.
        name:
          type: string
          maxLength: 191
        sku:
          type: string
          maxLength: 64
          description: |
            Letters, digits and hyphens only, unique across products (deleted
            products included). Leading and trailing spaces are removed and the
            value is converted to upper case before it is checked and saved.
          examples: ['HK-3001']
        description:
          type: string
          maxLength: 1000
        price:
          type: [number, string]
          minimum: 0
          maximum: 99999999.99
          description: A number from 0 to 99999999.99 with at most two decimal places. A numeric string such as `"34.90"` is accepted too.
          examples: [34.9]
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Units in stock. Defaults to `0` when creating a product.
        status:
          allOf:
            - $ref: '#/components/schemas/ProductStatus'
          description: Defaults to `active` when creating a product.
        tags:
          type: array
          maxItems: 50
          description: Tag names. Missing tags are created.
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
                maxLength: 191
          examples:
            - - text: Gift idea
              - text: Bestseller
        photo:
          type: [string, 'null']
          maxLength: 191
          description: A `path` returned by `POST /api/product/upload` (or, on update, the product's current value).
          examples: ['uploads/3hX0aZbQe1c9TfLwVq2Kj7Rr5Ns8Pm4Ud6Yo0Gi1.png']
    ProductCreateInput:
      description: Fields for creating a product. The same as `ProductInput`, except that `sku` is required.
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [sku]
    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Product'
    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PaginatorMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Product'
