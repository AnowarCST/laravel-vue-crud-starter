# AWS CodeBuild template (disabled).
#
# Every line of this file is a comment, and CodeBuild only reads a
# buildspec you point a project at, so nothing runs until you enable it.
# This is a starting point, not a tested pipeline: the uncommented YAML was
# parsed and checked against the buildspec version 0.2 layout, and the
# check commands are the same as in the GitHub Actions CI, but this file has
# not been run on AWS.
#
# What it does, once enabled
#   - Runs the same checks as .github/workflows/ci.yml, inside the project's
#     own images from docker/Dockerfile (CodeBuild's managed images may not
#     offer PHP 8.5 and Node 26):
#       PHP:      composer validate --strict, composer install,
#                 composer audit, composer lint (Pint),
#                 composer analyse (Larastan), php artisan test
#       Frontend: npm ci, npm run lint, npm run format:check,
#                 npm audit --audit-level=moderate, npm run build
#   - Builds the production image (target "prod") and pushes it to Amazon
#     ECR, tagged <first 12 characters of the commit SHA>-<build number>.
#   - Writes imagedefinitions.json, which the CodePipeline "Amazon ECS"
#     deploy action uses to roll the new image out (see
#     deploy/aws/ecs-task-definition.yml).
#
# How to enable
#   1. Copy this file to the repository root as buildspec.yml, or keep it
#      here and set the project's buildspec name to deploy/aws/buildspec.yml.
#   2. Remove the "# " at the start of every line below the line of dashes.
#   3. Create the ECR repository once:
#        aws ecr create-repository --repository-name laravel-vue-crud-starter \
#          --image-tag-mutability IMMUTABLE \
#          --image-scanning-configuration scanOnPush=true
#      If you choose another name, change ECR_REPOSITORY below.
#   4. Create a CodeBuild project:
#        - Source: this repository on GitHub (for example through an AWS
#          CodeConnections connection). Webhook event: pushes to main.
#          Do not turn on pull request builds for this project, and never
#          for forks: they would run the pull request's code with the
#          project's role, which can push images. GitHub Actions already
#          checks pull requests.
#        - Environment: a current Amazon Linux or Ubuntu standard image
#          (x86_64), and turn on "Privileged" mode. Docker builds need it.
#          A medium or larger compute type is a sensible start.
#        - Artifacts: none for a stand-alone project; CodePipeline sets
#          them when the project is a pipeline stage.
#   5. Give the CodeBuild service role, in addition to the CloudWatch Logs
#      permissions CodeBuild adds itself:
#        - ecr:GetAuthorizationToken on "*";
#        - ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload,
#          ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage and
#          ecr:BatchGetImage on the repository's ARN only.
#      sts:GetCallerIdentity, used to find the account ID, needs no
#      permission. No access keys are needed: CodeBuild uses the role.
#
# Environment variables
#   CodeBuild sets AWS_DEFAULT_REGION, CODEBUILD_SRC_DIR,
#   CODEBUILD_RESOLVED_SOURCE_VERSION and CODEBUILD_BUILD_NUMBER itself.
#   ECR_REPOSITORY (below) can be overridden in the project settings.
#   The checks need no secrets. The image never contains .env or keys;
#   give the running container its configuration as environment variables
#   and secrets (see deploy/aws/ecs-task-definition.yml).
#
# Notes
#   - Builds pull the PHP, Composer and Node base images from Docker Hub,
#     which limits anonymous pulls. If builds fail with "toomanyrequests",
#     log in to Docker Hub in pre_build (token in AWS Secrets Manager) or
#     use an ECR pull through cache.
#   - Migrations are never run automatically. Take a database backup, then
#     run "php artisan migrate --force" as a one-off ECS task.
# ------------------------------------------------------------------------
