# Deployment template for GitHub Actions (disabled).
#
# Every line of this file is a comment, and it lives outside
# .github/workflows/, so GitHub never runs it. It is a starting point, not
# a tested deployment: it was checked with actionlint, but it has not been
# run against a real registry or server.
#
# What it does, once enabled
#   1. "image" job: on a version tag (v1.2.3) or a manual run, builds the
#      production image (docker/Dockerfile, target "prod") and pushes it to
#      GitHub Container Registry as ghcr.io/<owner>/<repo>, tagged with the
#      version and the full commit SHA. It logs in with the workflow's own
#      GITHUB_TOKEN, so no registry password is stored.
#   2. "deploy" job (optional, skipped unless the repository variable
#      DEPLOY_ENABLED is "true"): connects to one server over SSH and runs
#      "docker compose pull" and "docker compose up -d" for the app
#      service, using the exact image digest that job 1 pushed.
#
# How to enable
#   1. Copy this file to .github/workflows/deploy.yml.
#   2. Remove the "# " at the start of every line below the line of dashes
#      (in most editors: select the lines and toggle comments), and delete
#      this header if you like.
#   3. Settings > Actions > General > Workflow permissions can stay
#      "Read repository contents". The image job asks for packages: write
#      itself.
#   4. Push a tag (git tag v1.0.0 && git push origin v1.0.0) or start it
#      from Actions > Deploy > Run workflow.
#   5. Packages created by a workflow may start as private. Check the
#      package's visibility under your profile or organization > Packages.
#
# To use the SSH deploy job
#   Settings > Environments > New environment "production" (add required
#   reviewers if you want an approval step), then add:
#     variables  DEPLOY_HOST   server name or IP address
#                DEPLOY_USER   SSH user that may run docker compose
#                DEPLOY_PATH   directory on the server with compose.yaml
#     secrets    DEPLOY_SSH_KEY      private key for that user (use a key
#                                    made only for deployments)
#                DEPLOY_KNOWN_HOSTS  output of "ssh-keyscan <host>", checked
#                                    by hand against the server's key
#   Then set the repository variable DEPLOY_ENABLED to "true" (Settings >
#   Secrets and variables > Actions > Variables).
#   On the server, the compose file's app service uses the image the job
#   passes in, for example:
#       services:
#         app:
#           image: ${APP_IMAGE:-ghcr.io/<owner>/<repo>:<version>}
#           env_file: .env.production
#           ports: ["127.0.0.1:8080:8080"]
#           volumes: ["storage:/var/www/html/storage"]
#   If the package is private, run "docker login ghcr.io" on the server once,
#   with a token that has only the read:packages scope.
#   Migrations are never run automatically. Take a database backup, then
#   run "docker compose exec app php artisan migrate --force" (SECURITY.md,
#   production checklist).
#
# Deploying somewhere else
#   Replace the "deploy" job with your platform's step. For a cloud
#   provider (AWS, Azure, Google Cloud), prefer OpenID Connect over
#   long-lived keys: give that job "permissions: id-token: write" and use the
#   provider's official login action (for example
#   aws-actions/configure-aws-credentials with role-to-assume, or
#   azure/login with client-id, tenant-id and subscription-id). Pin every
#   action to a full commit SHA, as the other workflows do. For AWS CodeBuild
#   and Azure Pipelines, see deploy/aws/ and deploy/azure/.
#
# Security notes
#   - Pull requests never trigger this workflow; only tags and manual runs.
#   - Secrets reach only the deploy job, through env: and never through
#     ${{ }} inside run:.
#   - The deploy job checks the server's host key (StrictHostKeyChecking=yes)
#     and deletes the private key when the step ends.
