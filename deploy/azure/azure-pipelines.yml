# Azure Pipelines template (disabled).
#
# Every line of this file is a comment, and Azure Pipelines only runs a YAML
# file that a pipeline points at, so nothing runs until you enable it. This
# is a starting point, not a tested pipeline: the uncommented YAML was
# parsed and checked against Microsoft's Azure Pipelines YAML schema, and
# the check commands are the same as in the GitHub Actions CI, but this file
# has not been run on Azure DevOps.
#
# The live azure-pipelines.yml at the repository root is a separate,
# smaller pipeline that only runs when started by hand; see its header.
#
# What it does, once enabled
#   - Checks stage: the same checks as .github/workflows/ci.yml, inside the
#     project's own images from docker/Dockerfile:
#       PHP:      composer validate --strict, composer install,
#                 composer audit, composer lint (Pint),
#                 composer analyse (Larastan), php artisan test
#       Frontend: npm ci, npm run lint, npm run format:check,
#                 npm audit --audit-level=moderate, npm run build
#   - Image stage (commits on main only): builds the production image
#     (target "prod") and pushes it to Azure Container Registry, tagged with
#     the commit SHA.
#
# How to enable
#   1. Create the registry once, for example:
#        az acr create --resource-group <group> --name <registry> --sku Basic
#   2. In Azure DevOps: Project settings > Service connections > New >
#      Docker Registry > Azure Container Registry. Pick the registry, and
#      choose Workload Identity federation if it is offered, so no password
#      is stored. Put the connection's name in acrServiceConnection below.
#   3. Use this file in one of two ways:
#        - replace the root azure-pipelines.yml with it (keep the header of
#          the root file in mind: it explains the GitHub status check), or
#        - keep it here and create a new pipeline: Pipelines > New pipeline >
#          GitHub > this repository > Existing Azure Pipelines YAML file >
#          /deploy/azure/azure-pipelines.yml.
#   4. Remove the "# " at the start of every line below the line of dashes.
#   5. On the first run, approve the pipeline's use of the service
#      connection when Azure DevOps asks.
#
# Notes
#   - Do not let pull requests from forks use the service connection. Keep
#     "pr: none", or leave "Make secrets available to builds of forks" off
#     in the pipeline's trigger settings (Azure DevOps default).
#   - Deploying is not included. For example, to roll a new image out to
#     Azure Container Apps, add a stage with an AzureCLI@2 task that runs
#     "az containerapp update --name <app> --resource-group <group>
#     --image <registry>.azurecr.io/laravel-vue-crud-starter:<tag>".
#     Give the app its configuration as environment variables and secrets
#     (APP_KEY, DB_*, PASSPORT_*), never through the image, and run
#     migrations by hand after a backup (SECURITY.md, production checklist).
